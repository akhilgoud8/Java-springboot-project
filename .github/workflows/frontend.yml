name: Frontend to EC2

on:
  workflow_dispatch:



jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT REPOSITORY
      # ============================================================

      - name: Checkout Repository
        uses: actions/checkout@v5


      # ============================================================
      # 2. SET UP JAVA
      # Required for SonarQube scanner
      # ============================================================

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # 3. SONARQUBE SCAN
      # ============================================================

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=frontend
            -Dsonar.projectName=frontend
            -Dsonar.sources=frontend


      # ============================================================
      # 4. SONARQUBE QUALITY GATE
      # ============================================================

      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.0
        timeout-minutes: 10
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }


      # ============================================================
      # 5. DEPLOY TO EC2
      # ============================================================

      - name: Deploy Frontend to EC2
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -e

            echo "=========================================="
            echo "Starting Frontend Deployment"
            echo "=========================================="

            APP_DIR="/home/ec2-user/front"
            REPO_NAME="Java-springboot-project"
            REPO_URL="https://github.com/CloudTechDevOps/Java-springboot-project.git"

            # ========================================================
            # CREATE APPLICATION DIRECTORY
            # ========================================================

            mkdir -p "$APP_DIR"

            cd "$APP_DIR"

            # ========================================================
            # CLONE OR UPDATE REPOSITORY
            # ========================================================

            if [ -d "$REPO_NAME/.git" ]; then

              echo "Repository already exists."
              echo "Pulling latest code..."

              cd "$REPO_NAME"

              git reset --hard
              git clean -fd

              git checkout main
              git pull origin main

            else

              echo "Repository does not exist."
              echo "Cloning repository..."

              git clone "$REPO_URL"

              cd "$REPO_NAME"

            fi

            # ========================================================
            # INSTALL PYTHON
            # ========================================================

            echo "Installing Python..."

            sudo dnf install -y python3 python3-pip

            # ========================================================
            # FRONTEND DIRECTORY
            # ========================================================

            cd "$APP_DIR/$REPO_NAME/frontend"

            echo "Frontend directory:"
            pwd

            # ========================================================
            # CREATE VIRTUAL ENVIRONMENT
            # ========================================================

            if [ ! -d "venv" ]; then

              echo "Creating Python virtual environment..."

              python3 -m venv venv

            fi

            # ========================================================
            # INSTALL PYTHON DEPENDENCIES
            # ========================================================

            echo "Installing Python dependencies..."

            ./venv/bin/python -m pip install --upgrade pip

            ./venv/bin/pip install -r requirements.txt

            # ========================================================
            # VERIFY STREAMLIT
            # ========================================================

            echo "Checking Streamlit installation..."

            ./venv/bin/streamlit --version

            # ========================================================
            # CREATE SYSTEMD SERVICE
            # ========================================================

            echo "Creating frontend systemd service..."

            sudo tee /etc/systemd/system/frontend.service > /dev/null <<EOF
            [Unit]
            Description=Streamlit Frontend Application
            After=network.target

            [Service]
            Type=simple
            User=ec2-user

            WorkingDirectory=/home/ec2-user/front/Java-springboot-project/frontend

            ExecStart=/home/ec2-user/front/Java-springboot-project/frontend/venv/bin/streamlit run app.py --server.port=8501 --server.address=0.0.0.0

            Environment="API_URL=http://localhost:8084"

            Restart=always
            RestartSec=5

            StandardOutput=append:/home/ec2-user/frontend.log
            StandardError=append:/home/ec2-user/frontend-error.log

            [Install]
            WantedBy=multi-user.target
            EOF

            # ========================================================
            # RELOAD SYSTEMD
            # ========================================================

            echo "Reloading systemd..."

            sudo systemctl daemon-reload

            # ========================================================
            # ENABLE SERVICE
            # ========================================================

            sudo systemctl enable frontend

            # ========================================================
            # RESTART FRONTEND
            # ========================================================

            echo "Restarting frontend..."

            sudo systemctl restart frontend

            # ========================================================
            # WAIT FOR STARTUP
            # ========================================================

            echo "Waiting for frontend startup..."

            sleep 10

            # ========================================================
            # CHECK SERVICE
            # ========================================================

            echo "Checking frontend service..."

            sudo systemctl status frontend --no-pager

            # ========================================================
            # CHECK PORT
            # ========================================================

            echo "Checking port 8501..."

            if sudo ss -lntp | grep ':8501'; then

              echo "=========================================="
              echo "Frontend is running on port 8501"
              echo "=========================================="

            else

              echo "=========================================="
              echo "ERROR: Frontend is NOT listening on port 8501"
              echo "=========================================="

              echo "Frontend logs:"
              sudo journalctl -u frontend --no-pager -n 100

              exit 1

            fi

            echo "=========================================="
            echo "Frontend Deployment Completed Successfully"
            echo "=========================================="
