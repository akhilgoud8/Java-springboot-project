name: Backend to EC2

on:
  workflow_dispatch:

  # Uncomment if you also want deployment on push to main
  # push:
  #   branches:
  #     - main

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT SOURCE CODE
      # ============================================================
      - name: Checkout Repository
        uses: actions/checkout@v5

      # ============================================================
      # 2. SET UP JAVA 17
      # ============================================================
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # ============================================================
      # 3. BUILD + SONARQUBE SCAN
      # ============================================================
      - name: Build and SonarQube Scan
        working-directory: backend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          set -e

          echo "Java version:"
          java -version

          echo "Maven version:"
          mvn -version

          echo "Running Maven build and SonarQube analysis..."

          mvn clean verify \
            org.sonarsource.scanner.maven:sonar-maven-plugin:3.9.1.2184:sonar \
            -DskipTests \
            -Dsonar.projectKey=backend \
            -Dsonar.projectName=backend \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.token="$SONAR_TOKEN"

      # ============================================================
      # 4. SONARQUBE QUALITY GATE
      # ============================================================
      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.0
        with:
          scanMetadataReportFile: backend/target/sonar/report-task.txt
        timeout-minutes: 10
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # ============================================================
      # 5. PREPARE EC2
      # ============================================================
      - name: Prepare EC2
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -e

            echo "Installing required packages..."

            sudo yum install -y \
              git \
              maven \
              java-17-amazon-corretto

            echo "Java version:"
            java -version

            echo "Maven version:"
            mvn -version

      # ============================================================
      # 6. CLONE / UPDATE APPLICATION REPOSITORY
      # ============================================================
      - name: Clone / Pull Repository
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -e

            APP_DIR="/home/ec2-user/app"
            REPO_NAME="Java-springboot-project"
            REPO_URL="https://github.com/CloudTechDevOps/Java-springboot-project.git"

            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            if [ -d "$REPO_NAME/.git" ]; then

              echo "Repository already exists."
              echo "Pulling latest changes..."

              cd "$REPO_NAME"

              git reset --hard
              git clean -fd

              git checkout main
              git pull origin main

            else

              echo "Repository does not exist."
              echo "Cloning repository..."

              git clone "$REPO_URL"

            fi

            echo "Repository updated successfully."

      # ============================================================
      # 7. BUILD MAVEN APPLICATION
      # ============================================================
      - name: Build Maven Application
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -e

            cd /home/ec2-user/app/Java-springboot-project/backend

            echo "Building Spring Boot application..."

            java -version
            mvn -version

            mvn clean package -DskipTests -U

            echo "Build completed."

            echo "Generated JAR files:"
            ls -lh target/*.jar

      # ============================================================
      # 8. STOP OLD APPLICATION
      # ============================================================
      - name: Stop Old Application
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          script_stop: false
          script: |
            echo "Checking for existing application..."

            PID=$(ps -ef | grep '[d]atastore-0.0.7.jar' | awk '{print $2}')

            if [ -z "$PID" ]; then
              echo "Application is not running."
              exit 0
            fi

            echo "Stopping PID: $PID"

            kill -15 "$PID" || true

            sleep 5

            if ps -p "$PID" > /dev/null 2>&1; then
              echo "Force killing PID: $PID"
              kill -9 "$PID" || true
            fi

            echo "Application stopped."

      # ============================================================
      # 9. START NEW APPLICATION
      # ============================================================
      - name: Start Application
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -e

            APP_DIR="/home/ec2-user/app/Java-springboot-project/backend/target"
            LOG_DIR="/var/log/app"
            JAR_FILE="datastore-0.0.7.jar"

            sudo mkdir -p "$LOG_DIR"
            sudo chown ec2-user:ec2-user "$LOG_DIR"

            cd "$APP_DIR"

            if [ ! -f "$JAR_FILE" ]; then
              echo "ERROR: $JAR_FILE does not exist."
              exit 1
            fi

            echo "Starting application..."

            nohup env \
              MYSQL_HOST="${{ secrets.DB_HOST }}" \
              MYSQL_PORT="3306" \
              MYSQL_USERNAME="${{ secrets.DB_USERNAME }}" \
              MYSQL_PASSWORD="${{ secrets.DB_PASSWORD }}" \
              LOG_FILE_PATH="$LOG_DIR/datastore.log" \
              java -jar "$JAR_FILE" \
              --server.port=8084 \
              > "$LOG_DIR/nohup.out" 2>&1 &

            echo $! > "$LOG_DIR/datastore.pid"

            echo "Application started."
            echo "PID: $(cat "$LOG_DIR/datastore.pid")"

      # ============================================================
      # 10. VERIFY APPLICATION HEALTH
      # ============================================================
      - name: Verify Application
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -e

            echo "Checking application health..."

            for i in {1..12}; do

              HEALTH=$(curl -s http://localhost:8084/actuator/health || true)

              echo "Health response:"
              echo "$HEALTH"

              if [[ "$HEALTH" == *'"status":"UP"'* ]]; then
                echo "===================================="
                echo "Application is healthy."
                echo "===================================="
                exit 0
              fi

              echo "Application is not ready yet."
              echo "Attempt $i/12"

              sleep 5

            done

            echo "===================================="
            echo "Application failed health check."
            echo "===================================="

            echo "Last application logs:"
            tail -100 /var/log/app/nohup.out || true

            exit 1
