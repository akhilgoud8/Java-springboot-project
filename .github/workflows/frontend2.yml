name: Frontend to EC2 (Docker)

on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - main

env:
  ECR_REGISTRY: 058264395605.dkr.ecr.us-east-1.amazonaws.com
  IMAGE_NAME: frontend
  AWS_REGION: us-east-1

jobs:
  build-scan-deploy:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. CHECKOUT REPOSITORY
      # ============================================================
      - name: Checkout Repository
        uses: actions/checkout@v5

      # ============================================================
      # 2. VERIFY REQUIRED SECRETS ARE SET
      # ============================================================
      - name: Verify required secrets
        run: |
          if [ -z "${{ secrets.API_URL }}" ]; then
            echo "ERROR: API_URL secret is not set in GitHub repo settings."
            exit 1
          fi
          echo "API_URL secret is present."

      # ============================================================
      # 3. SET UP JAVA 17 (required for SonarQube scanner)
      # ============================================================
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # 4. SONARQUBE SCAN
      # ============================================================
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=frontend
            -Dsonar.projectName=frontend
            -Dsonar.sources=frontend

      # ============================================================
      # 5. SONARQUBE QUALITY GATE
      # ============================================================
      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.0
        timeout-minutes: 10
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # ============================================================
      # 6. CONFIGURE AWS CREDENTIALS
      # ============================================================
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ============================================================
      # 7. ENSURE ECR REPOSITORY EXISTS
      # ============================================================
      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names "${{ env.IMAGE_NAME }}" --region ${{ env.AWS_REGION }} \
          || aws ecr create-repository --repository-name "${{ env.IMAGE_NAME }}" --region ${{ env.AWS_REGION }}

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
            docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}

      # ============================================================
      # 8. BUILD DOCKER IMAGE (only after Sonar gate passes)
      # ============================================================
      - name: Build Docker image
        working-directory: frontend
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .

      # ============================================================
      # 9. SMOKE-TEST CONTAINER IN CI
      # ============================================================
      - name: Run container in CI (smoke test)
        run: |
          docker run -d \
            --name ci-test-${{ env.IMAGE_NAME }} \
            -p 8501:8501 \
            -e API_URL="http://localhost:8084" \
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

          sleep 10

          for i in {1..10}; do
            if curl -sf http://localhost:8501/_stcore/health > /dev/null; then
              echo "Container is healthy."
              exit 0
            fi
            echo "Not ready yet ($i/10)..."
            sleep 3
          done

          echo "Container failed health check."
          docker logs ci-test-${{ env.IMAGE_NAME }}
          exit 1

      - name: Stop test container
        if: always()
        run: |
          docker stop ci-test-${{ env.IMAGE_NAME }} || true
          docker rm ci-test-${{ env.IMAGE_NAME }} || true

      # ============================================================
      # 10. TAG AND PUSH TO ECR
      # ============================================================
      - name: Push image to ECR
        run: |
          docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      # ============================================================
      # 11. DEPLOY TO EC2
      # ============================================================
      - name: Deploy Frontend to EC2
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -e

            if ! command -v docker &> /dev/null; then
              sudo dnf install -y docker || sudo yum install -y docker
              sudo usermod -aG docker ec2-user
            fi
            sudo systemctl start docker
            sudo systemctl enable docker

            aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
              docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}

            docker pull ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest

            docker stop ${{ env.IMAGE_NAME }} || true
            docker rm ${{ env.IMAGE_NAME }} || true

            docker run -d \
              --name ${{ env.IMAGE_NAME }} \
              -p 8501:8501 \
              -e API_URL="${{ secrets.API_URL }}" \
              --restart unless-stopped \
              ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest

            docker ps

            echo "Verifying API_URL was set correctly inside container:"
            docker exec ${{ env.IMAGE_NAME }} env | grep API_URL

      # ============================================================
      # 12. VERIFY DEPLOYED APPLICATION
      # ============================================================
      - name: Verify Frontend on EC2
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          script: |
            for i in {1..10}; do
              if curl -sf http://localhost:8501/_stcore/health > /dev/null; then
                echo "Frontend is healthy."
                exit 0
              fi
              echo "Not ready yet ($i/10)..."
              sleep 3
            done
            echo "Health check failed."
            docker logs ${{ env.IMAGE_NAME }} --tail 100
            exit 1
