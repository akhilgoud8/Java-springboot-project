name: Backend to EC2 (Docker)

on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - main

env:
  ECR_REGISTRY: 543855655532.dkr.ecr.us-east-1.amazonaws.com
  IMAGE_NAME: datastore-backend
  AWS_REGION: us-east-1

jobs:
  build-scan-deploy:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. CHECKOUT SOURCE CODE
      # ============================================================
      - name: Checkout Repository
        uses: actions/checkout@v5

      # ============================================================
      # 2. SET UP JAVA 17 (needed for the Sonar scan step only —
      #    the actual app build happens inside Docker below)
      # ============================================================
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # ============================================================
      # 3. BUILD + SONARQUBE SCAN
      # ============================================================
      - name: Build and SonarQube Scan
        working-directory: backend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          set -e
          mvn clean verify \
            org.sonarsource.scanner.maven:sonar-maven-plugin:3.9.1.2184:sonar \
            -DskipTests \
            -Dsonar.projectKey=backend \
            -Dsonar.projectName=backend \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.token="$SONAR_TOKEN"

      # ============================================================
      # 4. SONARQUBE QUALITY GATE
      # ============================================================
      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.0
        with:
          scanMetadataReportFile: backend/target/sonar/report-task.txt
        timeout-minutes: 10
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # ============================================================
      # 5. CONFIGURE AWS CREDENTIALS
      # ============================================================
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
            docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}

      # ============================================================
      # 6. BUILD DOCKER IMAGE (only after Sonar gate passes)
      # ============================================================
      - name: Build Docker image
        working-directory: backend
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .

      # ============================================================
      # 7. SMOKE-TEST CONTAINER IN CI
      # ============================================================
      - name: Run container in CI (smoke test)
        run: |
          docker run -d \
            --name ci-test-${{ env.IMAGE_NAME }} \
            -p 8084:8084 \
            -e MYSQL_HOST="${{ secrets.DB_HOST }}" \
            -e MYSQL_PORT="3306" \
            -e MYSQL_USERNAME="${{ secrets.DB_USERNAME }}" \
            -e MYSQL_PASSWORD="${{ secrets.DB_PASSWORD }}" \
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

          sleep 15

          for i in {1..12}; do
            HEALTH=$(curl -s http://localhost:8084/actuator/health || true)
            echo "$HEALTH"
            if [[ "$HEALTH" == *'"status":"UP"'* ]]; then
              echo "Container is healthy."
              exit 0
            fi
            echo "Not ready yet ($i/12)..."
            sleep 5
          done

          echo "Container failed health check."
          docker logs ci-test-${{ env.IMAGE_NAME }}
          exit 1

      - name: Stop test container
        if: always()
        run: |
          docker stop ci-test-${{ env.IMAGE_NAME }} || true
          docker rm ci-test-${{ env.IMAGE_NAME }} || true

      # ============================================================
      # 8. TAG AND PUSH TO ECR
      # ============================================================
      - name: Push image to ECR
        run: |
          docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      # ============================================================
      # 9. DEPLOY TO EC2
      # ============================================================
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -e

            aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
              docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}

            docker pull ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest

            docker stop ${{ env.IMAGE_NAME }} || true
            docker rm ${{ env.IMAGE_NAME }} || true

            docker run -d \
              --name ${{ env.IMAGE_NAME }} \
              -p 8084:8084 \
              -e MYSQL_HOST="${{ secrets.DB_HOST }}" \
              -e MYSQL_PORT="3306" \
              -e MYSQL_USERNAME="${{ secrets.DB_USERNAME }}" \
              -e MYSQL_PASSWORD="${{ secrets.DB_PASSWORD }}" \
              --restart unless-stopped \
              ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest

            docker ps

      # ============================================================
      # 10. VERIFY DEPLOYED APPLICATION HEALTH
      # ============================================================
      - name: Verify Application on EC2
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          script: |
            for i in {1..12}; do
              HEALTH=$(curl -s http://localhost:8084/actuator/health || true)
              echo "$HEALTH"
              if [[ "$HEALTH" == *'"status":"UP"'* ]]; then
                echo "Application is healthy."
                exit 0
              fi
              echo "Not ready yet ($i/12)..."
              sleep 5
            done
            echo "Health check failed."
            docker logs ${{ env.IMAGE_NAME }} --tail 100
            exit 1
